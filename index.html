  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LinguaLens — AI-Powered Chinese Learning Tool" />

  <meta property="og:locale:alternate" content="zh_CN" />

  <!-- PWA / Mobile -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LinguaLens" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>中</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "LinguaLens",
    "description": "AI-powered Chinese learning tool with 13 integrated modules for pronunciation, reading, translation, and immersive learning.",
    "url": "https://zturnsgo.com/apps#lingualens",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "offers": [
      {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free BYOK mode"
      }
    ]
  }
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sar: env(safe-area-inset-right);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
    }
    html, body, #root {
      height: 100%;
    }
    button { touch-action: manipulation; }
    input, textarea, select { font-size: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function(){var t=localStorage.getItem('lingualens_theme');if(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.classList.add('dark')})();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
